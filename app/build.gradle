plugins {
    id 'com.android.application'
}

android {
    namespace 'org.codex.dualoutputprobe'
    compileSdk 35

    defaultConfig {
        applicationId 'org.codex.dualoutputprobe'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
